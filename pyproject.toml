[project]
name = "pancancer-biological-universe"
version = "0.1.0"
description = "Modal-first pan-cancer biological universe and multi-reinforcement workflow."
requires-python = ">=3.11"
dependencies = [
  "modal>=1.3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "requests>=2.32",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "joblib>=1.4",
  "openpyxl>=3.1",
  "h5py>=3.11",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["publication_repository", "manuscript_package", "final_results", ".vendor_xena"]
